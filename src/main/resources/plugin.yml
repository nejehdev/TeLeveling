name: TeLeveling
version: 0.0.2
main: dev.nejeh.televeling.TeLevelingPlugin
api-version: '1.21'
description: Configurable player levels and experience
authors: [Nejeh]
softdepend: [PlaceholderAPI]
libraries:
  - com.zaxxer:HikariCP:6.2.1
  - org.xerial:sqlite-jdbc:3.49.1.0
  - com.mysql:mysql-connector-j:9.2.0
commands:
  televeling:
    description: Manage TeLeveling and player progression
    usage: /televeling <help|reload|addxp|removexp|setxp|setlevel|reset>
    aliases: [tl]
permissions:
  televeling.admin:
    description: Allows managing TeLeveling and player progression
    default: op
